<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とっくんの助骨で大根をおろすゲーム</title>
<style>
  :root{
    --bg1:#eaf5fb;
    --bg2:#cfe7f7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    overflow:hidden;
    color:#2c4a5e;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    padding:10px 0 0 0;
  }
  h1{
    font-size: clamp(16px, 4vw, 24px);
    margin: 4px 0 2px 0;
    letter-spacing: 1px;
    color:#1f5c8b;
    text-shadow: 1px 1px 0 #eef8ff;
    text-align:center;
    padding: 0 10px;
  }
  #sub{
    font-size: 13px;
    color:#5b8fae;
    margin-bottom: 6px;
  }
  #hud{
    display:flex;
    gap: 12px;
    align-items:center;
    margin-bottom:6px;
    font-size: 13px;
    flex-wrap: wrap;
    justify-content:center;
    padding: 0 8px;
  }
  #hud .chip{
    background:#eef8ff;
    border: 2px solid #8fc6e8;
    border-radius: 999px;
    padding: 4px 12px;
    font-weight:bold;
    color:#1f5c8b;
    box-shadow: 0 2px 0 #5fa8d3;
    white-space:nowrap;
  }
  #resetBtn{
    background:#1f5c8b;
    color:#eef8ff;
    border:none;
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow: 0 3px 0 #123a58;
  }
  #resetBtn:active{
    box-shadow: 0 1px 0 #123a58;
    transform: translateY(2px);
  }
  #timerWrap{
    width: 300px;
    max-width: 88vw;
    margin: 2px 0 4px 0;
  }
  #timerLabel{
    display:flex;
    justify-content:space-between;
    font-size: 11px;
    color:#3d7ba3;
    margin-bottom:2px;
    font-weight:bold;
  }
  #timerBarBg{
    width:100%;
    height: 14px;
    background:#dceefb;
    border: 2px solid #8fc6e8;
    border-radius: 999px;
    overflow:hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
  }
  #timerBarFill{
    height:100%;
    width:100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4fa8dd, #1f5c8b);
    transition: width 0.1s linear, background 0.3s ease;
  }
  #timerBarFill.warn{
    background: linear-gradient(90deg, #e0a13f, #c96a1f);
  }
  #timerBarFill.danger{
    background: linear-gradient(90deg, #e06a5f, #c23b2f);
  }
  #bannerSlot{
    width: 100%;
    display:flex;
    justify-content:center;
    align-items:center;
    height: 0px;
    overflow:visible;
    margin: 0;
  }
  #status-banner{
    background:#fff8ea;
    border:3px solid #3d8fc4;
    border-radius:16px;
    padding: 8px 20px;
    font-size:14px;
    font-weight:bold;
    color:#1f5c8b;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    z-index: 10;
    opacity:0;
    transform: translateY(-6px) scale(0.85);
    pointer-events:none;
    transition: all 0.3s ease;
    text-align:center;
    white-space:nowrap;
    margin-top: -2px;
  }
  #status-banner.show{
    opacity:1;
    transform: translateY(6px) scale(1);
  }
  #stage{
    position:relative;
    width: 340px;
    height: 560px;
    max-width: 92vw;
    touch-action:none;
    cursor: default;
  }
  #plate{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    width: 240px;
    bottom: 0px;
    z-index: 3;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
    pointer-events:none;
    transition: filter 0.2s;
  }
  #tokkun{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    width: 350px;
    top: 110px;
    z-index: 1;
    pointer-events:none;
  }
  #daikon{
    position:absolute;
    width: 70px;
    z-index: 5;
    pointer-events:none;
    transform-origin: center center;
    filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.25));
  }
  .particle{
    position:absolute;
    z-index: 4;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #f1f1e6 70%, #e3e3d6);
    box-shadow: 0 0 2px rgba(0,0,0,0.15);
    pointer-events:none;
  }
  #hint{
    position:absolute;
    bottom: 8px;
    left:50%;
    transform: translateX(-50%);
    font-size: 12px;
    color:#6fa8c9;
    z-index: 6;
    pointer-events:none;
    white-space:nowrap;
    animation: fade 2.2s infinite;
  }
  @keyframes fade{
    0%,100%{opacity:0.35;}
    50%{opacity:0.95;}
  }
  #timeup-overlay{
    position:absolute;
    inset:0;
    background: rgba(234,245,251,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 20;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease;
  }
  #timeup-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  #timeup-card{
    background:#fff8ea;
    border:3px solid #3d8fc4;
    border-radius:18px;
    padding: 18px 26px;
    text-align:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
  }
  #timeup-card .big{
    font-size:18px;
    font-weight:bold;
    color:#1f5c8b;
    margin-bottom:6px;
  }
  #timeup-card .small{
    font-size:13px;
    color:#5b8fae;
  }
  footer{
    font-size:11px;
    color:#7fa9c2;
    margin-top:4px;
  }
</style>
</head>

<div id="app">
  <h1>とっくんの助骨で大根をおろすゲーム</h1>
  <div id="sub">とっくんのおなかの上でだいこんを左右にうごかそう</div>
  <div id="hud">
    <div class="chip">スリスリ回数: <span id="strokeCount">0</span></div>

    <button id="resetBtn">リセット</button>
  </div>
  <div id="timerWrap">
    <div id="timerLabel"><span>のこり時間</span><span id="timerText">20.0秒</span></div>
    <div id="timerBarBg"><div id="timerBarFill"></div></div>
  </div>
  <div id="bannerSlot">
    <div id="status-banner">おろしMAX！ とっくん、がんばった！</div>

  const STAGE_THRESHOLDS = [10, 25, 50, 80, 120, 160]; // stage1〜6に到達する累計回数

  // Belly zone (grating zone), relative to #stage box, in px, tuned for the tokkun art
  const zone = { xMin: 60, xMax: 280, yMin: 190, yMax: 290 };
  const TOKKUN_TOP = 110;
  const TOKKUN_HEIGHT = 350 * (1640/2360);
  const TIP_Y = TOKKUN_TOP + TOKKUN_HEIGHT/2; // だいこんの先端をここに合わせる（キャラクターの中心）

  let currentStage = 0;

  let timeLeft = TIME_LIMIT;
  let timerHandle = null;

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function updateDaikonPosition(x,y){
    daikonX = clamp(x, zone.xMin, zone.xMax);
    daikonY = clamp(y, zone.yMin, zone.yMax);
    const w = daikon.offsetWidth || 70;
    const h = daikon.offsetHeight || (w * 772/471);
    daikon.style.left = (daikonX - w/2) + 'px';
    // 大根の下の先端がキャラクターの中心（TIP_Y）に来るように固定
    daikon.style.top = (TIP_Y - h) + 'px';
  }

  function stageFromStrokes(n){
    let s = 0;
    for(let i=0;i<STAGE_THRESHOLDS.length;i++){
      if(n >= STAGE_THRESHOLDS[i]) s = i+1;
    }
    return clamp(s, 0, MAX_STAGE);
  }

  function showBanner(text, autoHideMs){
    statusBanner.textContent = text;
    statusBanner.classList.add('show');
    if(autoHideMs){
      setTimeout(()=>statusBanner.classList.remove('show'), autoHideMs);
    }
  }

  function setStage(n){
    n = clamp(n, 0, MAX_STAGE);
    if(n !== currentStage){
      currentStage = n;
      plate.src = oroshiImgs[currentStage];
      plate.animate([
        { transform:'translateX(-50%) scale(1.08)' },
        { transform:'translateX(-50%) scale(1)' }
      ], { duration:220, easing:'ease-out' });
      if(currentStage === MAX_STAGE){
        showBanner('おろしMAX！ とっくん、がんばった！', 1800);
      }
    }
    stageCountEl.textContent = currentStage;
  }

  function spawnParticles(x, y, count){
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random()*5;
      p.style.width = size+'px';
      p.style.height = size+'px';
      const startX = x + (Math.random()*24 - 12);
      const startY = y + (Math.random()*8);
      p.style.left = startX + 'px';
      p.style.top = startY + 'px';
      stage.appendChild(p);

      const fallDist = stage.offsetHeight - startY - 30 + Math.random()*20;
      const drift = (Math.random()*30 - 15);
      const duration = 650 + Math.random()*350;

      p.animate([
        { transform:'translate(0,0)', opacity:1 },
        { transform:`translate(${drift}px, ${fallDist}px)`, opacity:0.9, offset:0.85 },
        { transform:`translate(${drift}px, ${fallDist+6}px)`, opacity:0 }
      ], { duration: duration, easing:'cubic-bezier(.4,.4,.7,1)' })
      .onfinish = () => p.remove();
    }
  }

  function registerStroke(){
    strokes++;
    strokeCountEl.textContent = strokes;
    setStage(stageFromStrokes(strokes));
    hint.style.display = 'none';
  }

  function handleMove(clientX, clientY){
    if(!gameActive) return;
    const rect = stage.getBoundingClientRect();
    const scaleX = stage.offsetWidth / rect.width;
    const scaleY = stage.offsetHeight / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    updateDaikonPosition(x, y);

    const inZone = x >= zone.xMin-10 && x <= zone.xMax+10 && y >= zone.yMin-40 && y <= zone.yMax+40;

    if(lastX !== null && inZone){
      const dx = x - lastX;
      if(Math.abs(dx) >= 1){
        particleTravel += Math.abs(dx);
        if(particleTravel > 10){
          particleTravel = 0;
          spawnParticles(daikonX, daikonY + 18, 1);
        }
      }
      if(Math.abs(dx) >= MIN_MOVE_TO_COUNT){
        const dir = dx > 0 ? 1 : -1;
        if(lastDir !== 0 && dir !== lastDir){
          if(distSinceReversal >= REVERSAL_MIN_DIST){
            registerStroke();
            spawnParticles(daikonX, daikonY + 20, 4);
            distSinceReversal = 0;
          }
        }
        if(dir === lastDir){
          distSinceReversal += Math.abs(dx);
        } else {
          distSinceReversal = Math.abs(dx);
        }
        lastDir = dir;
      }
    }
    lastX = x;
    lastY = y;
  }

  // Mouse events
  stage.addEventListener('mousemove', (e)=>{
    handleMove(e.clientX, e.clientY);
  });
  stage.addEventListener('mouseleave', ()=>{
    lastX = null; lastY = null; lastDir = 0; distSinceReversal = 0;
  });

  // Touch events
  stage.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    const t = e.touches[0];
    if(t) handleMove(t.clientX, t.clientY);
  }, { passive:false });
  stage.addEventListener('touchstart', (e)=>{
    if(!gameActive) return;
    const t = e.touches[0];
    if(t){
      const rect = stage.getBoundingClientRect();
      const scaleX = stage.offsetWidth / rect.width;
      const scaleY = stage.offsetHeight / rect.height;
      lastX = (t.clientX - rect.left) * scaleX;
      lastY = (t.clientY - rect.top) * scaleY;
      updateDaikonPosition(lastX, lastY);
    }
  }, { passive:true });
  stage.addEventListener('touchend', ()=>{
    lastX = null; lastY = null; lastDir = 0; distSinceReversal = 0;
  });

  // ---- Timer ----
  function updateTimerUI(){
    const pct = clamp((timeLeft / TIME_LIMIT) * 100, 0, 100);
    timerBarFill.style.width = pct + '%';
    timerText.textContent = Math.max(0, timeLeft).toFixed(1) + '秒';
    timerBarFill.classList.remove('warn','danger');
    if(timeLeft <= 5){
      timerBarFill.classList.add('danger');
    } else if(timeLeft <= 10){
      timerBarFill.classList.add('warn');
    }
  }

  function startTimer(){
    timeLeft = TIME_LIMIT;
    updateTimerUI();
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(()=>{
      if(!gameActive) return;
      timeLeft -= 0.1;
      if(timeLeft <= 0){
        timeLeft = 0;
        updateTimerUI();
        endGame('timeup');
      } else {
        updateTimerUI();
      }
    }, 100);
  }

  function endGame(reason){
    if(!gameActive) return;
    gameActive = false;
    clearInterval(timerHandle);
    lastX = null; lastY = null;
    hint.style.display = 'none';
    timeupTitle.textContent = 'タイムアップ！';
    timeupDetail.textContent = `最終おろし度: ${currentStage} / 6（スリスリ回数: ${strokes}）`;
    timeupOverlay.classList.add('show');
  }

  function resetGame(){
    strokes = 0;
    currentStage = 0;
    lastDir = 0;
    distSinceReversal = 0;
    particleTravel = 0;
    gameActive = true;
    strokeCountEl.textContent = 0;
    plate.src = oroshiImgs[0];
    stageCountEl.textContent = 0;
    hint.style.display = 'block';
    document.querySelectorAll('.particle').forEach(p=>p.remove());
    statusBanner.classList.remove('show');
    timeupOverlay.classList.remove('show');
    startTimer();
  }

  resetBtn.addEventListener('click', resetGame);

  // init
  updateDaikonPosition(daikonX, daikonY);
  startTimer();
})();
</script>
</body>
</html>
